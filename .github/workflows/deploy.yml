name: Deploy Zensical site

on:
  push:
    branches:
      - main
  # Reconstruction quotidienne : publie les notes d'actualité et les guides
  # programmés dont la date est atteinte (build_actualites.py et
  # build_guides.py, option --drop-future).
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

env:
  TZ: Europe/Brussels

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Retirer les notes et guides programmés, régénérer sitemap et llms.txt
        run: |
          python scripts/build_actualites.py --drop-future
          python scripts/build_guides.py --drop-future
          python scripts/build_sitemap.py
          python scripts/build_llms.py

      - name: Build site
        run: zensical build --clean

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
